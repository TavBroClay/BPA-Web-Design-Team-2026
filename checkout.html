    <div class="checkoutForm">
        <form class="checkoutForm" action="" method="post">

                <legend>Checkout</legend>
                <fieldset class="billingForm">
                    <legend>Billing Info</legend>  
                        <div id="creditInfo">
                            <label for="creditNumber">Credit Card Number</label>
                            <input id="creditNumber" inputmode="numeric" type="text" minlength="16" maxlength="16" placeholder="1111 2222 3333 4444" required>
                            <label for="expiration">Expiration Date</label>
                            <input id="expiration" type="month" required>
                            <label for="CVV">CVV</label>
                            <input id="CVV" type="text" placeholder="CVV" required>
                        </div>

                        <br>

                        <div id="billingAddress">
                            <label for="billStreet">Billing Address</label>
                            <input id="billStreet" type="text" placeholder="Street" required>
                            <input id="billStreet2" type="text" placeholder="Street 2">
                            <input id="billCity" type="text" placeholder="City" required>                            
                            <select id="billState" name="State" required>

                        </div>

                </fieldset>
                <fieldset id="shippingForm">
                    <legend>Shipping Info</legend>
                        <div id="shippingAddress">
                            <label for="shipStreet">Shipping Address</label>
                            <input id="shipStreet" type="text" placeholder="Street" required>
                            <input id="shipStreet2" type="text" placeholder="Street 2">
                            <input id="shipCity" type="text" placeholder="City" required>
