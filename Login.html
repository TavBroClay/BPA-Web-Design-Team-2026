            <!-- Log In Form -->
            <div id="logIn">
                <form id="logInForm" method="post">
                    <div id='loginInfo'>
                        <input type="text" name="username" id="username" required="" placeholder="Username" tabindex="1">
                        <input type="password" name="password" id="password" required="" placeholder="Password" tabindex="2">
                        <input type="checkbox" onclick="showPass()">
                    </div>
                    <label for="remember">Remember Me</label>
                    <input type="checkbox" name="remember" id="remember" tabindex="3">
                    <input type="submit" name="login" id="login" value="Log In" tabindex="4">
                </form>

    <script>
        var usernameLogIn = "johnMarlowby";
        var passwordLogIn = "testPassword!1";
        const logInForm = document.getElementById("logInForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        logInForm.addEventListener("submit", function logInVerify(){
            event.preventDefault();
            if (usernameInput.value !== usernameLogIn || passwordInput.value !== passwordLogIn){
                alert("Invalid username or password");
            }
            else{
                alert("Login successful");
            }
        });
        
        function showPass(){
            if (passwordInput.type === "password"){
                passwordInput.type = "text";
            }
            else{
                passwordInput.type = "password";
            }
        }
    </script>
