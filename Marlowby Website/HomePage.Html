<style>
        #slider {
            overflow: hidden;
        }
        #slider figure {
            position: relative;
            width: 1000%;
            margin: 0;
            left: 0;
            animation: 180s slider infinite;
         }
        #slider figure div {
            position: absolute;
            color: white;
            text-shadow: 5px 5px 5px black;
        }
        #slider figure div h1 {
            margin-top: 475px;
            margin-bottom: 0;
            font-size: 70px;
        }
        #slider figure div p {
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 5px;
            font-size: 20px;
            width: 50%;
        }
        #slider figure button {
            padding: 1rem;
            font-family: "Century Gothic", sans-serif;
            background-color: rgb(247 148 30);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
         #slider figure button a {
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            transition: 0.25s;
        }
        #slider figure button a:hover {
        font-size: 1.30rem;
        }
        #slider figure img {
          float: left;
          width: 10%;
          height: 750px;
        }
        @keyframes slider {
            0% {left: 0%;}
            5% {left: 0%;}
            10% {left: -100%;}
            15% {left: -100%;}
            20% {left: -200%;}
            25% {left: -200%;}
            30% {left: -300%;}
            35% {left: -300%;}
            40% {left: -400%;}
            45% {left: -400%;}
            50% {left: -500%;}
            55% {left: -500%;}
            60% {left: -600%;}
            65% {left: -600%;}
            70% {left: -700%;}
            75% {left: -700%;}
            80% {left: -800%;}
            85% {left: -800%;}
            90% {left: -900%;}
            95% {left: -900%;}
            100% {left: 0%;}
        }
    </style>
</head>
