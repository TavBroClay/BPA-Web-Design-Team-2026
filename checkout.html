                    <fieldset class="billingForm">
                        <legend>Billing Info</legend>  
                            <div id="creditInfo">
                                <label for="creditNumber">Credit Card Number</label>
                                <input id="creditNumber" inputmode="numeric" type="text" minlength="16" maxlength="16" placeholder="1111 2222 3333 4444" required>
                                <label for="expiration">Expiration Date</label>
                                <input id="expiration" type="month" required>
                                <br>
                                <label for="CVV">CVV</label>
                                <input id="CVV" type="text" placeholder="CVV" minlength="3" maxlength="4" required>
                            </div>

                            

                            <div id="billingAddress">

                                <input id="billStreet" type="text" placeholder="Street" required>

                                <br>
                                <input id="billCity" type="text" placeholder="City" required>

                            </div>
