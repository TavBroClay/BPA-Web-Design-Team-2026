<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="NavBar.css">
    <link rel="stylesheet" type="text/css" href="LoginStyle.css">
    <link rel="icon" type="image/x-icon" href="Images/Logo/MarlowbyWebsite-Icon.png">
    <title>Marlowby/Login</title>
</head>
<body>
    <div class="navBar">
        <nav>
            <img src="Images/Logo/Marlowby Website-NavLogo.png" translate="Marlowby">
            <ul class="navLinkes">
                <li id="welcomeMessage"></li>
                <hr>
                <li><a href="index.html">Home</a></li>
                <li><a href="Cities.html">Cities</a></li>
                <li><a href="AboutUs.html">About</a></li>
                <li><a href="Subscription.html">Subscriptions</a></li>
                <li style="padding: 1.25rem 25px; color: white;" class="activePage" id="loginNav">Login</li>
            </ul>
        </nav>
        <div class="greenLine">_</div>
        <div class="orangeLine">_</div>
        <div class="blueLine">_</div>
    </div>

    <p style="margin-top: 6.5dvh; visibility: hidden;">_</p>

    <div class="loginPage">
    

        <button id="clearLocal" onclick="clearLocalStorage()">Clear Local Storage</button>
        <div class="forms">
            <fieldset id="registrationForms"  style="display: none;">
                <legend><img src="Images/Logo/Marlowby Website-NavLogo.png" alt="Marlowby"></legend> 

                <div class="pageToggles">
                    <button id="registerButton" onclick="openRegister()">Register</button>
                    <button id="logInButton" onclick="openLogIn()">Log In</button>
                </div>

                <!-- Registration Form -->
                <div id="register">
                    <form id="registerForm" action="https://formgrid.dev/api/f/4gd42asl" method="post">
                        <div id='registerInfo'>
                            <input type="email" name="email" id="emailRegistration" required="" placeholder="Email" tabindex="1">
                            <input type="text" name="username" id="usernameRegistration" required="" placeholder="Username" tabindex="2">
                            <div class="passwordField">
                                <input type="password" name="password" id="passwordRegistration" required="" placeholder="Password" tabindex="3">
                                <i id="registerEyeIcon"><ion-icon name="eye-outline" id="showPass" onclick="registerShowPass()" class="passwordFieldIcon"></ion-icon></i>
                            </div>
                        <label for="remember">Remember Me</label>
                        <input type="checkbox" name="remember" id="rememberRegister" tabindex="4">
                        <input type="submit" name="register" id="registerSubmit" value="Register" tabindex="5">
                        <br>
                        <p id="registerMessage"></p>
                    </form>
                </div>
            </fieldset>

            <fieldset id="logInForms">
                <legend><img src="Images/Logo/Marlowby Website-NavLogo.png" alt="Marlowby"></legend> 

                <div class="pageToggles">
                    <button id="registerButton" onclick="openRegister()">Register</button>
                    <button id="logInButton" onclick="openLogIn()">Log In</button>
                </div>

                <!-- Log In Form -->
                <div id="logIn">
                    <form id="logInForm" action="https://formgrid.dev/api/f/6eh7u6au" method="post">
                        <div id='loginInfo'>
                            <input type="text" name="username" id="username" required="" placeholder="Username" tabindex="1">
                            <div class="passwordField">
                                <input type="password" name="password" id="password" required="" placeholder="Password" tabindex="2">
                                <i id="eyeIcon"><ion-icon name="eye-outline" id="showPass" onclick="showPass()" class="passwordFieldIcon"></ion-icon></i>
                            </div>
                        <label for="remember">Remember Me</label>
                        <input type="checkbox" name="remember" id="remember" tabindex="3">
                        <input type="submit" name="login" id="loginSubmit" value="Log In" tabindex="4">
                        <br>
                        <p id="logInMessage"></p>
                    </form>
                </div>
            </fieldset>
        </div>
    </div>
    
    <script src="logInForms.js"></script>
    <script src="logInScripts.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>
</html>
