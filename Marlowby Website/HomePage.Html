<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="NavBar.css">
    <link rel="icon" type="image/x-icon" href="Images/Logo/MarlowbyWebsite-Icon.png">
    <title>Marlowby/Home</title>
<style>
        #slider {
            overflow: hidden;
        }
        #slider figure {
            position: relative;
            width: 1000%;
            margin: 0;
            left: 0;
            animation: 60s slider infinite;
        }
        #slider figure img {
          float: left;
          width: 10%;
          height: 750px;
        }
        @-webkit-keyframes slider {
            0% {left: 0;}
            10% {left: 0;}
            20% {left: -100%;}
            30% {left: -100%;}
            40% {left: -200%;}
            50% {left: -200%;}
            60% {left: -300%;}
            70% {left: -300%;}
            80% {left: -400%;}
            90% {left: -400%;}
            100% {left: -500%;}
            110% {left: -500;}
            120% {left: -600%;}
            130% {left: -600%;}
            140% {left: -700%;}
            150% {left: -700%;}
            160% {left: -800%;}
            170% {left: -800%;}
            180% {left: -900%;}
            190% {left: -900%;}
            200% {left: -100%;}
        }
    </style>
</head>
<body>
    <nav>
        <img src="Images/Logo/Marlowby Website-NavLogo.png" translate="Marlowby">
        <ul class="navLinkes">
            <li><a href="HomePage.html">Home</a></li>
            <li><a href="Cities.html">Cities</a></li>
            <li><a href="AboutUs.html">About</a></li>
            <li><a href="Subscription.html">Subscriptions</a></li>
        </ul>
        <button class="btns"><a href="Login.html">Login</a></button>
    </nav>
    <header>
        <div class="greenLine">_</div>
        <div class="orangeLine">_</div>
        <div class="blueLine">_</div>
        <p style="text-align: center; font-size: 50px; font-weight: bold; margin-top: 40px; margin-bottom: 25px;">Explore Your City, One Box at a Time.</p>
        <p style="text-align: center; font-size: 20px;">Discover the best experiences you can get, from different cities across the United States, all within the comforts of your home.<br>
        We currently have 50 cities across the nation, for you to explore!</p>
    </header>
    <div id="slider">
        <figure>
            <img src="Images/Cities/Edgar Cotto-Tampa-unsplash.jpg" alt="Tampa">
            <img src="Images/Cities/Jake Blucker-Los Angeles-unsplash.jpg" alt="Los Angeles">
            <img src="Images/Cities/Jordan Griffith-Columbus-unsplash.jpg" alt="Columbus">
            <img src="Images/Cities/Lance Asper-Jacksonville-unsplash.jpg" alt="Jacksonville">
            <img src="Images/Cities/Luca Bravo-New York City-unsplash.jpg" alt="New York City">
            <img src="Images/Cities/Mick Haupt-Tulsa-unsplash.jpg" alt="Tulsa">
            <img src="Images/Cities/Pretty Pink-Philadelphia-unsplash.jpg" alt="Philadelphia">
            <img src="Images/Cities/Richard McDavid-Chicago-unsplash.jpg" alt="Chicago">
            <img src="Images/Cities/Trac Vu-Arlington-unsplash.jpg" alt="Arlington">
            <img src="Images/Cities/Trac Vu-Houston-unsplash.jpg" alt="Houston">
        </figure>
    </div>
</body>
</html>
